name: CI
on: [push,pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm}
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm --prefix functions ci
      - run: npm --prefix functions run build
